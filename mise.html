<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiseForecast</title>
</head>
<body>
    <header>
        <h1>MiseForecast</h1>
        <p>waste less, Plan better.</p>
    </header>

    <main>
        <section>
            <h2>Service</h2>
            <label for="covers">Expected covers</label> 
                <!--attribute 'for' is for the label to know that it 'belongs' to the input id-->
            <input type="number" id="covers" min="0" step="1"> 
                <!--step one is for the num to be whole it steps one unite at a time 1, 2, 3 etc...-->
            
        </section>
        <section>
            <h2>Dishes</h2>
            <fieldset>
                <legend>dish</legend>
                <label for="dish">Dish name</label>
                <input type="text" id="dish">
                <label for="popularity">Popularity</label>
                <input type="number" id="popularity" min="0" max="100" step="1">
                    <!--sets the percentage of popularity-->
                <label for="stock">Current stock</label>
                <input type="number" id="stock" min="0" step="1">
            </fieldset>
            <button type="button">Add dish</button>
        </section>
        
         <section>
            <h2>Forecast</h2>
            <output>
        </section>
      
    </main>
    

   
</body>
</html>
